name: Sync Code Connect

# Fires on PRs that touch demo component sources. OpenAI Codex CLI reads
# the changed .tsx files, compares props against the matching .figma.ts
# under demo/src/figma/, and, if there is drift, opens a stacked PR that
# updates the Code Connect files.
#
# The sync PR targets the source PR's head branch so both changes ship
# together and can be reviewed by the design-system team independently.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "demo/src/ui/**/*.tsx"

concurrency:
  group: sync-cc-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    # Skip when the trigger is the sync bot's own PR (avoids self-loops).
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'sync-cc/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # Submodules aren't needed for Code Connect sync — skip to keep
          # the job fast and avoid pulling ~500MB of sds/ content.
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git identity
        run: |
          git config user.name "codex-sync[bot]"
          git config user.email "codex-sync@users.noreply.github.com"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Authenticate Codex with API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printenv OPENAI_API_KEY | codex login --with-api-key

      - name: Run Codex to sync .figma.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          codex exec \
            --dangerously-bypass-approvals-and-sandbox \
            -C "$GITHUB_WORKSPACE" \
            --json \
            -o /tmp/codex-last-message.txt \
            "$(cat <<PROMPT
          You are running in GitHub Actions on pull request #${PR_NUMBER}
          (head branch: ${PR_HEAD}, base branch: ${PR_BASE}).

          ## Goal

          Keep the Code Connect template files under `demo/src/figma/`
          aligned with the React component props defined under
          `demo/src/ui/`. Only edit `.figma.ts` files — never edit the
          component source.

          ## Steps

          1. List the component files changed in this PR:
             `git diff --name-only origin/${PR_BASE}...HEAD -- 'demo/src/ui/**/*.tsx'`
          2. For each changed component `.tsx`, find the matching template:
               - `demo/src/ui/compositions/ProductCard/ProductCard.tsx`
                  → `demo/src/figma/ProductCard.figma.ts`
               - `demo/src/ui/primitives/SizeChip/SizeChip.tsx`
                  → `demo/src/figma/SizeChip.figma.ts`
               - `demo/src/ui/compositions/SizeSelector/SizeSelector.tsx`
                  → `demo/src/figma/SizeSelector.figma.ts`
          3. Read both files. Compare the exported prop types against what
             the `.figma.ts` maps via
             `figma.selectedInstance.getString/getEnum/getBoolean` and the
             JSX snippet inside the `figma.code` template literal. Detect
             drift:
               - Prop added → add a matching `getString/getEnum/getBoolean`
                 binding (choose by TS type: `string` → getString, union of
                 literals → getEnum, `boolean` → getBoolean, `number` →
                 getString and cast in the snippet) and include it in the
                 snippet.
               - Prop removed → delete the binding and the snippet reference.
               - Prop renamed → rename in both places.
               - Enum union widened → add the new value to the `getEnum`
                 options map.
             Assume the Figma property name matches the code prop name in
             PascalCase (e.g. `rating` → `"Rating"`).
          4. Run `git status --short demo/src/figma/` to confirm what
             changed.
          5. If nothing changed: print `no drift — exiting` and stop.
          6. If `.figma.ts` files changed:
             a. `git checkout -b sync-cc/${PR_HEAD}` (or `-B` if the branch
                already exists on origin).
             b. `git add demo/src/figma/`
             c. `git commit -m "chore(code-connect): sync .figma.ts for PR #${PR_NUMBER}"`
             d. `git push -u origin sync-cc/${PR_HEAD}` (append
                `--force-with-lease` if reusing an existing branch).
             e. Check for an existing sync PR with
                `gh pr list --head sync-cc/${PR_HEAD} --json number`.
                If none exists, create one:
                  gh pr create \
                    --base ${PR_HEAD} \
                    --head sync-cc/${PR_HEAD} \
                    --title "chore(code-connect): sync for #${PR_NUMBER}" \
                    --body "Auto-generated by the sync-code-connect workflow. Syncs the .figma.ts template files under demo/src/figma/ to match the component prop changes in #${PR_NUMBER}. Review the diff, then merge this PR before merging #${PR_NUMBER}."
             f. Comment on the source PR once (only if no comment exists):
                  gh pr comment ${PR_NUMBER} --body "🤖 Code Connect sync PR opened: <URL>"

          ## Constraints

          - Only touch files under `demo/src/figma/`. Do not edit component
            sources, `package.json`, or any other file.
          - Do not install packages or run tests.
          - Do not open more than one sync PR per source PR.
          - Never push directly to the source PR's branch.
          PROMPT
          )"

      - name: Show Codex last message
        if: always()
        run: |
          if [ -f /tmp/codex-last-message.txt ]; then
            echo "----- codex last message -----"
            cat /tmp/codex-last-message.txt
          fi
